name: BitChord 1.0.2 Dual Volume - unsigned IPA

on:
  push:
    branches: [feature/dual-volume-v1.0.2]
    paths:
      - "AppleApp/**"
      - ".github/workflows/build-dual-volume-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    steps:
      - name: Checkout custom BitChord 1.0.2
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Java 21 for Kotlin Multiplatform
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust toolchain and Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list cmake >/dev/null 2>&1 || brew install cmake
          xcodegen --version
          rustc --version
          java -version

      - name: Verify dual volume and original audio-mixing support
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DualVolumeControl(appVolume:' AppleApp/Sources/UI/NowPlaying/NowPlayingView+Transport.swift
          grep -q 'systemOrange' AppleApp/Sources/UI/NowPlaying/DualVolumeControl.swift
          grep -q 'Haptics.play(.select)' AppleApp/Sources/UI/NowPlaying/DualVolumeControl.swift
          grep -q 'mixWithOthers' AppleApp/Sources/PlaybackSession/AudioSessionManager.swift
          xcrun swiftc -frontend -parse AppleApp/Sources/UI/NowPlaying/DualVolumeControl.swift
          xcrun swiftc -frontend -parse AppleApp/Sources/UI/NowPlaying/NowPlayingView+Transport.swift
          xcrun swiftc -frontend -parse AppleApp/Sources/PlaybackSession/PlaybackController.swift

      - name: Build release Kotlin shared framework
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=release ./scripts/build-shared-framework.sh

      - name: Build release Rust audio engine and Swift bindings
        shell: bash
        run: |
          set -euo pipefail
          NATIVE_TARGETS="aarch64-apple-darwin aarch64-apple-ios" ./scripts/build-native-core.sh

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec AppleApp/project.yml
          xcodebuild -list -project AppleApp/BitChord.xcodeproj

      - name: Build unsigned IPA app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project AppleApp/BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BitChordDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build 2>&1 | tee "$RUNNER_TEMP/bitchord-xcodebuild.log"

      - name: Package and checksum unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BitChordDerivedData/Build/Products/Release-iphoneos/BitChord.app"
          test -f "$APP/BitChord"
          test -f "$APP/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.music.bitchord" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.0.2" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "41" ]
          mkdir -p package/Payload dist
          /usr/bin/ditto "$APP" package/Payload/BitChord.app
          find package -name embedded.mobileprovision -type f -delete
          (cd package && /usr/bin/zip -qry -9 ../dist/BitChord-1.0.2-DualVolume-unsigned.ipa Payload)
          unzip -tq dist/BitChord-1.0.2-DualVolume-unsigned.ipa
          (cd dist && shasum -a 256 BitChord-1.0.2-DualVolume-unsigned.ipa > SHA256.txt)
          ls -lh dist/*

      - name: Upload IPA and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-1.0.2-DualVolume-unsigned-IPA
          path: dist/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-build-failure-log
          path: ${{ runner.temp }}/bitchord-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
